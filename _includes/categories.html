<aside class="categories">
  <h2>Categories</h2>
  <ul>
    <li><a href="{{ '/communities.html' | relative_url }}#">All Posts</a></li>
    {% assign cats = site.categories | sort %}
    {% for cat in cats %}
    <li><a href="{{ '/communities.html' | relative_url }}#{{ cat[0] | slugify }}">{{ cat[0] }}</a></li>
    {% endfor %}
  </ul>
</aside>
