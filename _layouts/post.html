---
layout: default
---
<section class="section">
  <div class="container blog-grid">
    <article class="post">
      <a class="back-link" href="{{ '/communities.html' | relative_url }}">&larr; All Posts</a>
      <h1 class="post-title">{{ page.title }}</h1>
      {% include post-meta.html post=page %}
      {% if page.image %}
      <img class="post-logo" src="{{ page.image | relative_url }}" alt="{{ page.image_alt | default: page.title }}">
      {% endif %}
      <div class="post-body">
        {{ content }}
      </div>
    </article>
    {% include categories.html %}
  </div>
</section>
